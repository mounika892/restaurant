<!DOCTYPE html>
<html>
<head>
    <title>Spice Garden</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>🍴 Spice Garden</h1>

    <nav>
        <a href="#home">Home</a>
        <a href="#menu">Menu</a>
        <a href="#contact">Contact</a>
    </nav>
</header>

<main>

<section id="home">
    <h2>Welcome!</h2>
    <p>Enjoy our delicious food.</p>
    <img src="food.jpg" alt="Food" width="250">
    <br>
    <button>Order Now</button>
</section>

<section id="menu">
    <h2>Our Menu</h2>

    <article>
        <h3>Chicken Biryani</h3>
        <p>Price: ₹250</p>
    </article>

    <article>
        <h3>Pizza</h3>
        <p>Price: ₹200</p>
    </article>

    <ul>
        <li>Fresh Food</li>
        <li>Good Service</li>
        <li>Affordable Price</li>
    </ul>
</section>

<section id="contact">
    <h2>Contact Us</h2>

    <form>
        <label>Name:</label>
        <input type="text">
        <br><br>

        <label>Email:</label>
        <input type="email">
        <br><br>

        <textarea placeholder="Message"></textarea>
        <br><br>

        <button>Send</button>
    </form>
</section>

</main>

<footer>
    <p>thank you for visiting❤️.</p>
</footer>

</body>
</html>
